# Shared stock mini-swe-agent settings.
model: openrouter/openai/gpt-oss-20b
limits:
  steps: 40
  seconds: 300
  cost_usd: 0.15
security:
  checks:
    - name: jev
      enabled: false
      model: typesafe/jev-1.14
      risk_threshold: 3.0
      probability_threshold: 0.75
    - name: regex
      enabled: false
      patterns: []
