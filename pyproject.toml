[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-coding-agents"
version = "0.1.0"
description = "Minimal Inspect AI coding-agent evaluation research project"
requires-python = ">=3.12"
dependencies = ["inspect-ai>=0.3.273", "PyYAML>=6", "langfuse==4.16.0"]

[tool.setuptools]
packages = ["agents"]

[project.entry-points.inspect_ai]
secure_coding_agents_langfuse = "agents.tracing"

[project.optional-dependencies]
test = ["pytest>=8"]
