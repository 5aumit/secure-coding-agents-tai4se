[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-coding-agents"
version = "0.1.0"
description = "Minimal Inspect AI coding-agent evaluation research project"
requires-python = ">=3.12"
dependencies = ["inspect-ai>=0.3.273", "PyYAML>=6"]

[tool.setuptools]
packages = ["agents"]
